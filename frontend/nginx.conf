# Unprivileged nginx listens on 8080 (no root, no privileged ports).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't leak the nginx version.
    server_tokens off;

    # Baseline security headers for the whole site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Enforce HTTPS for a year (honoured by browsers only over TLS, which the
    # ingress terminates).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content Security Policy. The SPA loads its own bundled JS/CSS, talks to
    # the same-origin /api, and shows remote dish photos over https.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

    # Reverse-proxy the API to the INTERNAL backend Service (ClusterIP).
    # The browser calls same-origin "/api/..."; nginx forwards to the backend,
    # so the backend never has to be exposed to the internet. The trailing
    # slash on proxy_pass strips the "/api" prefix (/api/menu -> /menu).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Single-page app: fall back to index.html for client-side routes
    # like /staff/pos or /admin/reports.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; never cache index.html.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
