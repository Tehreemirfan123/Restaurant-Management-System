# Render Blueprint — free, card-free hosting for the FastAPI backend.
# Render → New → Blueprint → connect this repo. Render reads this file.
# The database is Neon (free) and the frontend is Vercel (free); this file is
# only the backend service. Fill the `sync: false` secrets in the Render UI.
services:
  - type: web
    name: mehak-kitchen-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Render assigns $PORT; run migrations + seed (idempotent) then the API.
    dockerCommand: sh -c "alembic upgrade head && python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: APP_ENV
        value: production
      - key: BUSINESS_UTC_OFFSET
        value: "5"
      - key: PAYMENT_GATEWAY
        value: sandbox
      # --- fill these in the Render dashboard (kept out of the repo) ---
      - key: DATABASE_URL        # from Neon (postgresql://...sslmode=require)
        sync: false
      - key: SECRET_KEY          # generate: openssl rand -hex 32
        sync: false
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://mehak-kitchen.vercel.app
        sync: false
