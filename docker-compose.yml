services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: restaurant_database
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/restaurant_database
      SECRET_KEY: change-me-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: "480"
      CORS_ORIGINS: http://localhost:5173,http://localhost
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: admin123
    # The image CMD only starts the API (migrations run as a K8s initContainer
    # in production). For local dev, apply migrations first here.
    command: ["sh", "-c", "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # Same-origin: nginx in the frontend image proxies /api to the backend
        # service (see frontend/nginx.conf).
        VITE_API_BASE_URL: /api
    depends_on:
      - backend
    # The hardened (unprivileged) nginx image listens on 8080.
    ports:
      - "5173:8080"

volumes:
  db_data:
